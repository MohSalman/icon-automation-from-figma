name: Export from Figma & Release

on:
  workflow_dispatch: {}
  # Nightly, so a batch of icons approved in Figma doesn't sit unpublished
  # for long. Adjust or remove once this is proven out.
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  id-token: write

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Export icons from Figma
        run: npm run figma:export
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}

      - name: Regenerate barrel + catalog
        run: npm run build:catalog

      - name: Duplicate-icon gate
        run: npm run check:duplicates

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build-storybook

      - name: Commit regenerated icons
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(icons): sync generated icons from Figma'
          file_pattern: 'src/icons/** src/index.ts src/icon-catalog.json'

      - name: Version, build, and publish
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # actions/setup-node's registry-url step writes an .npmrc that
          # reads the auth token from NODE_AUTH_TOKEN, not NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
