name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Duplicate-icon gate
        run: npm run check:duplicates

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm run build-storybook
